# Application settings. No secrets here — secrets come from .env only.
# Times are IST and MUST be quoted ("HH:MM"); unquoted 09:15 is parsed by
# YAML as a number.

app:
  name: nifty-options-self-learning-bot
  timezone: Asia/Kolkata
  # OBSERVE_ONLY | PAPER_AUTO_IMPROVE | LIVE_CANDIDATE_APPROVAL
  autonomy_level: PAPER_AUTO_IMPROVE

market_session:
  market_open: "09:15"
  market_close: "15:30"
  # NSE trading holidays (weekday closures) for the Equity Derivatives segment.
  # Source: NSE trading-holiday circular for calendar year 2026, plus NSE's
  # 12 Jan 2026 notice adding 15 Jan (Maharashtra municipal elections).
  # Add next year's dates as soon as NSE publishes them (usually December):
  # the bot logs CRITICAL at startup if the current year has no entries.
  # Quoted so YAML keeps them as strings.
  holidays:
    - "2026-01-15"   # Municipal Corporation Elections - Maharashtra
    - "2026-01-26"   # Republic Day
    - "2026-03-03"   # Holi
    - "2026-03-26"   # Shri Ram Navami
    - "2026-03-31"   # Shri Mahavir Jayanti
    - "2026-04-03"   # Good Friday
    - "2026-04-14"   # Dr. Baba Saheb Ambedkar Jayanti
    - "2026-05-01"   # Maharashtra Day
    - "2026-05-28"   # Bakri Id
    - "2026-06-26"   # Muharram
    - "2026-09-14"   # Ganesh Chaturthi
    - "2026-10-02"   # Mahatma Gandhi Jayanti
    - "2026-10-20"   # Dussehra
    - "2026-11-10"   # Diwali - Balipratipada
    - "2026-11-24"   # Prakash Gurpurb Sri Guru Nanak Dev
    - "2026-12-25"   # Christmas

instruments:
  nifty_index_key: "NSE_INDEX|Nifty 50"
  # The current-month NIFTY futures contract (for NIFTY_FUT signal
  # instruments) and all lot sizes are taken from the Upstox instrument list
  # every trading day - never configured here.
  strike_band: 5                 # subscribe ATM +/- N strikes (CE and PE) of the nearest expiry (owner 2026-11-15: 3 -> 5)
  india_vix_key: "NSE_INDEX|India VIX"   # recorded only (market_recording.record_vix); never traded or gated on

database:
  # Relative paths resolve against the project root.
  path: data/trading.db

broker:
  rest_base_url: https://api.upstox.com
  connect_timeout_seconds: 5
  request_timeout_seconds: 10
  max_retries: 3                 # idempotent GETs only; order requests are never auto-retried
  backoff_base_seconds: 0.5
  backoff_max_seconds: 30
  queue_timeout_seconds: 30      # max wait for a rate-limit slot before failing
  debounce_seconds: 1.0          # identical GETs within this window share one call
  token_expiry_time: "03:30"     # Upstox access tokens expire daily at this IST time
  max_clock_offset_seconds: 2    # PC clock vs Upstox server time: pre-flight FAIL / dashboard warning beyond this
  clock_check_interval_seconds: 900  # in-session PC clock re-check (3 rate-limited LTP calls each)
  circuit_breaker:
    base_cooldown_seconds: 1
    max_cooldown_seconds: 60
    max_consecutive_429: 5       # then the circuit stays open until manually reset

websocket:
  reconnect_base_seconds: 1
  reconnect_max_seconds: 60
  max_reconnect_attempts: 20     # then FAILED (kill-switch trigger in Phase 3)
  heartbeat_interval_seconds: 15
  heartbeat_timeout_seconds: 10
  stale_after_seconds: 10        # connected but silent this long -> data marked stale
  subscribe_chunk_size: 100
  market_data_mode: full         # ltpc | full | option_greeks | full_d30
  candle_flush_grace_seconds: 2  # timer closes a candle this long after its bucket ended (clock offset / latency)
  max_feed_lag_seconds: 2        # NIFTY tick lag (receipt - exchange time) above this -> WARNING (check PC clock)
  max_entry_feed_lag_seconds: 5  # ... above this NEW entries are blocked (exits never) until it recovers
  feed_summary_interval_seconds: 60  # INFO feed summary (messages, ticks, decode errors, lag)
  candle_partial_tolerance_seconds: 5  # first tick later than this into a non-contiguous bucket -> partial candle
  candle_repair_delay_seconds: 3  # wait before fetching the full version of a partial candle from Upstox
  max_frozen_price_seconds: 60   # NIFTY ticking at one unchanged price this long -> NEW entries blocked (exits never)
  portfolio_update_types: [order, position]

market_recording:                # saved for session reviews; trading never reads these tables
  enabled: true
  quote_interval_seconds: 5      # one option_quotes row per subscribed contract per interval
  held_quote_interval_seconds: 1 # ... this often while a position is open in the contract
  flush_interval_seconds: 5
  option_quote_retention_days: 30 # older option_quotes / market_quotes are deleted at start-up and after the close
  # Recording-only extras (decision-engine D1, owner 2026-11-15). Never traded, never used by an entry gate.
  next_expiry_band: 3            # also record the NEXT weekly expiry, ATM +/- 3 strikes (0 = off)
  record_vix: true               # subscribe India VIX and record its quotes
  record_market_quotes: true     # NIFTY index, current future and VIX quotes in market_quotes (5 s)
  max_rows_per_flush: 5000       # a backlog is written over several flushes, never in one long write
  # Expected load with these settings: about 39 subscriptions (Upstox full-mode limit 2,000) and about
  # 170,000 quote rows / 52 MB a day, about 1.2 GB at the 30-day retention.

paper_broker:
  starting_funds: 200000
  slippage_ticks: 1              # adverse ticks added to every simulated fill
  max_quote_age_seconds: 5       # never fill against a quote older than this
  simulate_partial_fills: true   # cap fills at top-of-book quantity
  allow_short_options: false     # strategies buy options; naked selling is refused

# Indian F&O (options) transaction costs. Verify against the current Upstox
# and NSE charge sheets before relying on simulated P&L.
costs:
  brokerage_per_order: 20.0      # ₹ per executed order
  stt_sell_pct: 0.15             # % of premium, sell side (rate from 2026-04-01)
  exchange_txn_pct: 0.03503      # % of premium, both sides (NSE options)
  sebi_fee_per_crore: 10.0       # ₹ per ₹1 crore turnover
  stamp_duty_buy_pct: 0.003      # % of premium, buy side
  gst_pct: 18.0                  # on brokerage + exchange txn + SEBI fee

execution:
  use_exchange_stop_orders: true   # resting SL-M protective order for every position
  entry_limit_buffer_ticks: 2      # entry LIMIT price = ask + buffer ticks
  entry_timeout_seconds: 30        # unfilled entry remainder is cancelled
  exit_order_type: MARKET          # exits prioritise certainty of execution
  exit_max_attempts: 5             # then CRITICAL alert + kill switch (manual intervention)
  exit_retry_base_seconds: 0.5
  exit_retry_max_seconds: 5
  reconcile_interval_seconds: 300  # periodic reconciliation (max 300)
  reconcile_debounce_seconds: 2    # after order updates
  square_off_check_seconds: 5

ml:
  # Models registered in the trading database (trained on HISTORICAL data only).
  artifact_dir: models
  # SYNTHETIC / research training runs and their separate registry database.
  research_dir: data/dev/ml
  min_seeds: 5                   # every ML experiment runs >= 5 seeds

# Phase 9 self-learning loop (LOG -> REFLECT -> HYPOTHESIZE -> MUTATE -> VERIFY
# -> PROMOTE / REJECT). What it may do on its own is app.autonomy_level:
# PAPER_AUTO_IMPROVE lets passing candidates (verified on HISTORICAL data)
# become PAPER_READY and deploy to PAPER. Nothing here can enable LIVE: LIVE
# approval always needs a named human, and this build has no LIVE routing.
learning:
  journal_enabled: true            # journal every closed trade (features at entry and exit)
  research_dir: data/dev/learning  # SYNTHETIC / research loop runs (never the trading DB)
  reflection_window_days: 5
  max_hypotheses_per_strategy: 3   # only whitelisted parameters are ever mutated
  min_sample_trades: 30            # minimum OOS trades before a candidate can pass
  paper_validation_days: 10        # PAPER days before a LIVE_CANDIDATE nomination
  paper_validation_min_trades: 20
  auto_deploy_paper: true          # PAPER_READY -> PAPER (only when autonomy allows)
  gates:
    min_expectancy_gain_rs: 50     # vs the production version, per trade, after costs
    min_expectancy_gain_pct: 5
    max_drawdown_worsening_pct: 10
    min_fold_win_share: 0.6        # walk-forward windows won or tied
    min_folds: 3
    max_stress_loss_ratio: 1.25
    bootstrap_resamples: 200       # seeded block bootstrap of daily P&L differences
    min_bootstrap_win_share: 0.8
    min_seeds: 5
  # Phase 10: run the loop inside the PAPER session after the close. Off until
  # you have a HISTORICAL dataset (meta.json "source": "HISTORICAL") to verify
  # candidates on. The loop reads the running bot's autonomy level at every
  # promotion step; a version it deploys runs from the NEXT session start.
  loop:
    enabled: false
    run_at: "15:45"                # IST, trading days only (never during the session)
    verify_data: null              # e.g. data/historical/nifty-2026q3
    reports_dir: reports/learning

# Phase 10 alerts. Telegram sends only when TELEGRAM_BOT_TOKEN and
# TELEGRAM_CHAT_ID are set in .env. Kill-switch, daily-loss and other CRITICAL
# alerts are always sent while Telegram is enabled.
alerts:
  telegram:
    enabled: true
    entries: true
    exits: true
    errors: true                   # ERROR / CRITICAL log lines, de-duplicated
    eod_summary: true
    min_severity: WARNING          # for every other alert (strategy paused, order rejected, ...)
    min_interval_seconds: 1.1      # Telegram allows about one message per second per chat
    queue_size: 200                # bounded; sending never blocks trading
    max_attempts: 3                # non-critical alerts only; CRITICAL ones retry until delivered
    request_timeout_seconds: 10
    error_dedupe_seconds: 300
    critical_retry_max_seconds: 30 # CRITICAL / kill-switch alerts retry until delivered (at most 30 s between tries)
    menu:                          # "Menu" in the chat: read-only buttons + confirmed controls (README, Telegram menu)
      enabled: true
      operator_name:               # name in the audit trail; empty = your Telegram account name
      poll_timeout_seconds: 25     # outbound long-polling only: no webhook, no open port
      min_press_interval_seconds: 1.0
      max_presses_per_minute: 20
      confirm_ttl_seconds: 60      # an unanswered "Are you sure?" expires
      stable_feed_seconds: 120     # Telegram reset needs the feed connected and stable this long
      result_timeout_seconds: 90
  eod_summary_time: "15:35"        # IST, after the square-off window

logging:
  level: INFO
  directory: logs
  file_name: bot.jsonl
  console: true
  max_bytes: 10485760   # 10 MiB per file
  backup_count: 10
