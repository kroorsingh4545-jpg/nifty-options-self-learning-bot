# Application settings. No secrets here — secrets come from .env only.
# Times are IST and MUST be quoted ("HH:MM"); unquoted 09:15 is parsed by
# YAML as a number.

app:
  name: nifty-options-self-learning-bot
  timezone: Asia/Kolkata
  # OBSERVE_ONLY | PAPER_AUTO_IMPROVE | LIVE_CANDIDATE_APPROVAL
  autonomy_level: PAPER_AUTO_IMPROVE

market_session:
  market_open: "09:15"
  market_close: "15:30"
  # NSE trading holidays (weekday closures) for the Equity Derivatives segment.
  # Source: NSE trading-holiday circular for calendar year 2026, plus NSE's
  # 12 Jan 2026 notice adding 15 Jan (Maharashtra municipal elections).
  # Add next year's dates as soon as NSE publishes them (usually December):
  # the bot logs CRITICAL at startup if the current year has no entries.
  # Quoted so YAML keeps them as strings.
  holidays:
    - "2026-01-15"   # Municipal Corporation Elections - Maharashtra
    - "2026-01-26"   # Republic Day
    - "2026-03-03"   # Holi
    - "2026-03-26"   # Shri Ram Navami
    - "2026-03-31"   # Shri Mahavir Jayanti
    - "2026-04-03"   # Good Friday
    - "2026-04-14"   # Dr. Baba Saheb Ambedkar Jayanti
    - "2026-05-01"   # Maharashtra Day
    - "2026-05-28"   # Bakri Id
    - "2026-06-26"   # Muharram
    - "2026-09-14"   # Ganesh Chaturthi
    - "2026-10-02"   # Mahatma Gandhi Jayanti
    - "2026-10-20"   # Dussehra
    - "2026-11-10"   # Diwali - Balipratipada
    - "2026-11-24"   # Prakash Gurpurb Sri Guru Nanak Dev
    - "2026-12-25"   # Christmas

instruments:
  nifty_index_key: "NSE_INDEX|Nifty 50"
  # The current-month NIFTY futures contract (for NIFTY_FUT signal
  # instruments) and all lot sizes are taken from the Upstox instrument list
  # every trading day - never configured here.
  strike_band: 3                 # subscribe ATM +/- N strikes (CE and PE) of the nearest expiry

database:
  # Relative paths resolve against the project root.
  path: data/trading.db

broker:
  rest_base_url: https://api.upstox.com
  connect_timeout_seconds: 5
  request_timeout_seconds: 10
  max_retries: 3                 # idempotent GETs only; order requests are never auto-retried
  backoff_base_seconds: 0.5
  backoff_max_seconds: 30
  queue_timeout_seconds: 30      # max wait for a rate-limit slot before failing
  debounce_seconds: 1.0          # identical GETs within this window share one call
  token_expiry_time: "03:30"     # Upstox access tokens expire daily at this IST time
  circuit_breaker:
    base_cooldown_seconds: 1
    max_cooldown_seconds: 60
    max_consecutive_429: 5       # then the circuit stays open until manually reset

websocket:
  reconnect_base_seconds: 1
  reconnect_max_seconds: 60
  max_reconnect_attempts: 20     # then FAILED (kill-switch trigger in Phase 3)
  heartbeat_interval_seconds: 15
  heartbeat_timeout_seconds: 10
  stale_after_seconds: 10        # connected but silent this long -> data marked stale
  subscribe_chunk_size: 100
  market_data_mode: full         # ltpc | full | option_greeks | full_d30
  portfolio_update_types: [order, position]

paper_broker:
  starting_funds: 200000
  slippage_ticks: 1              # adverse ticks added to every simulated fill
  max_quote_age_seconds: 5       # never fill against a quote older than this
  simulate_partial_fills: true   # cap fills at top-of-book quantity
  allow_short_options: false     # strategies buy options; naked selling is refused

# Indian F&O (options) transaction costs. Verify against the current Upstox
# and NSE charge sheets before relying on simulated P&L.
costs:
  brokerage_per_order: 20.0      # ₹ per executed order
  stt_sell_pct: 0.15             # % of premium, sell side (rate from 2026-04-01)
  exchange_txn_pct: 0.03503      # % of premium, both sides (NSE options)
  sebi_fee_per_crore: 10.0       # ₹ per ₹1 crore turnover
  stamp_duty_buy_pct: 0.003      # % of premium, buy side
  gst_pct: 18.0                  # on brokerage + exchange txn + SEBI fee

execution:
  use_exchange_stop_orders: true   # resting SL-M protective order for every position
  entry_limit_buffer_ticks: 2      # entry LIMIT price = ask + buffer ticks
  entry_timeout_seconds: 30        # unfilled entry remainder is cancelled
  exit_order_type: MARKET          # exits prioritise certainty of execution
  exit_max_attempts: 5             # then CRITICAL alert + kill switch (manual intervention)
  exit_retry_base_seconds: 0.5
  exit_retry_max_seconds: 5
  reconcile_interval_seconds: 300  # periodic reconciliation (max 300)
  reconcile_debounce_seconds: 2    # after order updates
  square_off_check_seconds: 5

ml:
  # Models registered in the trading database (trained on HISTORICAL data only).
  artifact_dir: models
  # SYNTHETIC / research training runs and their separate registry database.
  research_dir: data/dev/ml
  min_seeds: 5                   # every ML experiment runs >= 5 seeds

logging:
  level: INFO
  directory: logs
  file_name: bot.jsonl
  console: true
  max_bytes: 10485760   # 10 MiB per file
  backup_count: 10
