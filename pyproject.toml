[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty-options-self-learning-bot"
version = "0.1.0"
description = "NIFTY weekly options intraday bot (Upstox) — PAPER by default"
requires-python = ">=3.11"
readme = "README.md"
# Runtime dependencies, added phase by phase as they are used.
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
    # Phase 2
    "httpx>=0.27,<1",
    "websockets>=13",
    "protobuf>=6.33,<7",   # generated broker/proto code requires >= 6.33.5
    # Phase 4
    "APScheduler>=3.10,<4",
    # Phase 5 (dashboard)
    "streamlit>=1.40,<2",
    "plotly>=5.24,<7",
    "pandas>=2.2,<3",
    # Phase 7 (ML layer)
    "numpy>=1.26",
    "lightgbm>=4.3,<5",
    # Phase 8 (RL trade manager). Install the CPU build of torch first if you
    # have no GPU: pip install torch --index-url https://download.pytorch.org/whl/cpu
    "gymnasium>=1.0,<2",
    "stable-baselines3>=2.4,<3",
    "torch>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.24",
    "grpcio-tools>=1.66",  # regenerate broker/proto/*_pb2.py
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "pandas-stubs",
]

[tool.setuptools.packages.find]
include = [
    "backtest*", "broker*", "config*", "core*", "dashboard*", "data*", "execution*",
    "learning*", "ml*", "monitoring*", "options*", "risk*", "runtime*", "strategies*",
]
exclude = ["tests*"]

[tool.setuptools.package-data]
config = ["*.yaml"]
"data.storage" = ["schema.sql"]
"broker.proto" = ["*.proto", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that touch the filesystem or multiple modules",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "data/dev", "broker/proto/*_pb2.py", "broker/proto/*_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]  # fake secrets / tmp paths in tests

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^tests/", "^\\.venv/", "^broker/proto/.*_pb2\\.py$"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "plotly.*", "stable_baselines3.*", "gymnasium.*", "torch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["broker.proto.*"]
ignore_errors = true
