[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty-options-self-learning-bot"
version = "0.1.0"
description = "NIFTY weekly options intraday bot (Upstox) — PAPER by default"
requires-python = ">=3.11"
readme = "README.md"
# Phase 1 runtime dependencies. Later phases add FastAPI, Streamlit, pandas,
# NumPy, APScheduler, LightGBM/XGBoost and Stable-Baselines3 as they are used.
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
include = [
    "backtest*", "broker*", "config*", "core*", "dashboard*", "data*", "execution*",
    "learning*", "ml*", "monitoring*", "options*", "risk*", "strategies*",
]
exclude = ["tests*"]

[tool.setuptools.package-data]
config = ["*.yaml"]
"data.storage" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that touch the filesystem or multiple modules",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "data/dev"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]  # fake secrets / tmp paths in tests

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^tests/", "^\\.venv/"]
