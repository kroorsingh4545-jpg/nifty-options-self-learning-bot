# Research layer settings. Read only by research/; never by the trading bot.
# No secrets here. Dates are quoted ISO strings; times are IST "HH:MM".

store_path: data/research.db        # research's own database (never the trading DB)

instruments:
  nifty_index_key: "NSE_INDEX|Nifty 50"
  india_vix_key: "NSE_INDEX|India VIX"   # named as supported on the Upstox V3 historical-candle page

# Upstox calls from research run in a separate process with their own limiter.
# rate_share = fraction of the bot's effective (already buffered) limits that
# research may use (at most 0.1), so research and a running PAPER bot together
# stay at or below 90 % of the official limits (tested).
rate_share: 0.1
queue_timeout_seconds: 120        # research waits for its own budget; never borrows the bot's

history:
  daily_from: "2000-01-01"          # Upstox: daily candles from January 2000
  minute_from: "2022-01-01"         # Upstox: minute candles from January 2022
  minute_interval: 1
  daily_chunk_years: 5              # Upstox allows at most 10 years per daily request
  # Every research Upstox command is refused in this window on weekdays, so research
  # never competes with a running PAPER session for the rate-limit budget. Only
  # `contracts` and `chain-snapshot` (a few calls) may opt in with --during-session;
  # `history` and `smoke` never can.
  blocked_window:
    start: "08:30"
    end: "15:40"

chain:
  nearest_expiries: 3               # snapshot this many upcoming expiries ...
  include_next_monthly: true        # ... plus the nearest monthly expiry if not already in
  # `chain-schedule --during-session` takes a snapshot at each of these IST times (about 5 calls each)
  schedule: ["09:20", "11:00", "13:30", "15:20"]

# `data-quality`: review thresholds for each recorded session (decision-engine D1). Never trading rules.
data_quality:
  quote_interval_seconds: 5         # the bot's market_recording.quote_interval_seconds
  min_completeness: 0.99            # samples recorded / expected, per instrument, over its subscribed span
  max_gap_seconds: 30               # longest silence between two samples of one instrument
  max_missing_share: 0.01           # IV, Greeks, tbq/tsq, bid/ask: at most 1 % of option rows without them
  abnormal_spread_pct: 5.0          # (ask - bid) / mid above this is abnormal ...
  max_abnormal_spread_share: 0.01   # ... and may affect at most 1 % of option quotes
  stale_trade_seconds: 60           # last trade older than this when the quote arrived
  max_clock_offset_seconds: 2.0     # median NIFTY receipt - exchange time
  edge_tolerance_seconds: 120       # the index must be recorded within 2 minutes of the open and the close
  clean_sessions_required: 10       # D1 exit: this many clean sessions in a row

smoke:
  iv_check_rate: 0.065              # risk-free rate used ONLY to infer the chain's IV unit

# Forecast-vs-reality (R2). Regime cut-offs are PROVISIONAL reporting buckets
# (VIX-percentile terciles, a 1-sigma trend test); R3 validates a regime engine.
forecast:
  method_version: "r2.1"
  rv_window: 20                     # trailing close-to-close sessions
  ewma_lambda: 0.94                 # RiskMetrics
  har_min_train: 500                # sessions before the first HAR fit
  har_refit_every: 21               # refit on past data only, every N sessions
  regime_lookback: 252              # VIX percentile against the trailing N closes
  vol_terciles: [0.3333, 0.6667]
  trend_window: 20
  trend_z: 1.0
  min_intraday_minutes: 360         # a session needs this many 1-minute candles for intraday RV
  intraday_step_minutes: 5          # intraday RV sampling
  reliable_open_from: "2011-01-01"  # NIFTY daily opens before this often equal the previous close
  block_bootstrap: 20               # block length (sessions) for confidence intervals
  live_margin_minutes: 5            # "recorded live" only if made >= 5 min before 09:15 (PC clock drift)
  daily_final_after: "15:40"        # today's daily candle counts as final only after this time (IST)

# `shadow`: counterfactual outcome of every recorded signal (decision-engine D2). The trade rules
# (stops, targets, trailing, strike selection, slippage, square-off) are read from the bot
# configuration by the composition root; nothing here changes how the bot trades.
shadow:
  sim_version: "d2.1"               # recorded with every outcome; bump when the simulator changes
  option_tick_size: 0.05            # NIFTY option tick (Upstox instrument list)
  entry_tolerance_ticks: 1          # a real PAPER trade is reproduced when entry is within 1 tick ...
  exit_tolerance_ticks: 2           # ... exit within 2 ticks, and the exit reason and contract match
  spot_max_age_seconds: 60          # NIFTY price used to pick the ATM strike may be at most 60 s old

# `volatility` (decision-engine D3): option IV / Greeks at each signal, hold decay and costs vs the expected
# move, IV vs realised variance on matched windows, and the `intraday-vol` history study. Research only.
volatility:
  evidence_version: "d3.1"          # recorded with every evidence row; bump when the maths changes
  risk_free_rate: 0.065             # decimal, continuous; the same rate the ML feature pipeline uses
  dividend_yield: 0.0               # NIFTY yields ~1 %; 0 keeps parity with options/pricing.py
  horizon_minutes: 30               # the hold the ex-ante evidence assumes (capped at the square-off)
  default_overnight_share: 0.35     # share of daily variance in the overnight gap, when history is missing (R2)
  overnight_lookback_sessions: 252  # otherwise measured on the trailing sessions before the day (point in time)
  weekend_variance_multiple: 1.9    # close-to-close variance across a weekend vs a normal night (R2)
  quote_max_age_seconds: 10         # option quote used for IV at entry and at exit
  intraday_checkpoints: ["10:00", "11:30", "13:00", "14:00"]   # `intraday-vol`: forecast made at these times ...
  intraday_horizons: [15, 30, 60]                              # ... for the next N trading minutes

# `regime` (decision-engine D4): regime (R3) and Momentum Pulse, validated by `regime-validate` with a purged
# walk-forward, out of sample by calendar year. Fixed in advance; Pulse cutoffs are fitted on training years only.
regime:
  regime_version: "d4.1"
  checkpoints: ["10:00", "10:30", "11:00", "11:30", "12:00", "12:30", "13:00", "13:30", "14:00", "14:30"]
  horizon_minutes: 30               # outcome window after each checkpoint / ORB signal (same session)
  lookback_bars: 20                 # 1-minute bars for efficiency ratio, displacement and trailing sd
  adx_period: 10
  atr_short: 10
  atr_long: 20
  required_years: 3                 # KEEP only with the right sign in >= 3 test years ...
  min_group: 30                     # ... each with >= 30 samples per group, and a pooled 95 % CI excluding 0
  min_train: 200                    # Pulse cutoffs need at least this many training checkpoints
  n_boot: 1000                      # day-block bootstrap draws
  vix_lookback_sessions: 252        # VIX level / change percentiles against the trailing year
  trend_sessions: 20                # daily trend: 20-session move in sd units

# NIFTY weekly option expiry weekday by period (0 = Monday). A rule expiry on
# an exchange holiday moves to the previous trading day (holidays are observed
# from the candles). The switch dates below were CONFIRMED by the owner against
# NSE circular 103/2025 on 2026-11-14. A derived expiry is still labelled "rule"
# (not "observed") until it is seen in an Upstox contract list.
weekly_expiry_rules:
  - effective_from: "2019-02-11"    # NIFTY weekly options launched (Thursday expiry)
    weekday: 3
    source: "NSE: Thursday weekly expiry until the 28 Aug 2025 contract (end confirmed by owner, NSE circular 103/2025)"
  - effective_from: "2025-09-01"
    weekday: 1
    source: "NSE circular 103/2025 (confirmed by owner 2026-11-14): last Thursday expiry 2025-08-28, first Tuesday expiry 2025-09-02"
